<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Last Prompt Server</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Master Dashboard</p>
          <h1>The Last Prompt</h1>
        </div>
        <div class="status-strip">
          <span id="serverKey">server: ...</span>
          <span id="liveStatus">connecting</span>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
      </header>

      <main class="layout">
        <aside class="rail">
          <section>
            <div class="section-head">
              <h2>Live Sims</h2>
              <span id="queueCount">0 queued</span>
            </div>
            <div id="liveSims" class="list"></div>
          </section>

          <section>
            <div class="section-head">
              <h2>Archive</h2>
              <span id="archiveCount">0 sims</span>
            </div>
            <div id="archiveSims" class="list"></div>
          </section>
        </aside>

        <section class="stage">
          <div class="stage-head">
            <div>
              <p class="eyebrow" id="modeLabel">Live View</p>
              <h2 id="simTitle">No simulation selected</h2>
            </div>
            <div class="controls">
              <button id="playButton" type="button">Play</button>
              <input id="timeline" type="range" min="0" max="0" value="0" />
              <span id="tickLabel">tick 0</span>
            </div>
          </div>

          <div class="map-shell">
            <div id="mapGrid" class="map-grid"></div>
          </div>
        </section>

        <aside class="details">
          <section>
            <div class="section-head">
              <h2>Agents</h2>
              <span id="agentCount">0 alive</span>
            </div>
            <div id="agents" class="agent-list"></div>
          </section>

          <section>
            <div class="section-head">
              <h2>Events</h2>
              <span id="eventCount">0</span>
            </div>
            <div id="events" class="feed"></div>
          </section>

          <section>
            <div class="section-head">
              <h2>Actions</h2>
              <span id="actionCount">0</span>
            </div>
            <div id="actions" class="feed"></div>
          </section>
        </aside>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
